general {
  ignore_empty_input = true
}

background {
  monitor =
  path = ~/.wallpaper.jpg
  blur_passes = 2
}

label {
  monitor =
  text = cmd[update:1000] echo "$(date +"%H:%M")"
  font_size = 84
  font_family = Departure Mono NerdFont Bold
  position = 0, 100
  halign = center
  valign = center
}

label {
  monitor =
  text = cmd[update:1000] echo "$(date +"%A, %b %d")"
  font_size = 22
  font_family = Departure Mono NerdFont
  position = 0, 0
  halign = center
  valign = center
}

input-field {
  monitor =
  size = 400, 60
  outline_thickness = 2
  dots_size = 0.2
  dots_spacing = 0.35
  dots_center = true
  outer_color = rgba(255, 255, 255, 1)
  inner_color = rgba(0, 0, 0, 0.8)
  font_color = rgba(255,255,255,1)
  fade_on_empty = true
  rounding = -1
  placeholder_text = <i><span foreground="##cdd6f4">Type your Password...</span></i>
  hide_input = false
  position = 0, -150
  halign = center
  valign = center
}

image {
    monitor =
    path = ~/.me.jpg
    size = 100
    border_size = 2
    border_color = rgba(255, 255, 255, 1)
    position = 0, -400
    halign = center
    valign = center
}

